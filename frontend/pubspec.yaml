name: health_ai_app
description: "AI Health Coach - Your Personal Health Assistant"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  google_fonts: ^6.1.0

  # --- AUTHENTICATION ---
  google_sign_in: ^6.2.1
  flutter_facebook_auth: ^6.0.0
  sign_in_with_apple: ^5.0.0

  # --- STATE MANAGEMENT (Riverpod v2 Stable) ---
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.3.5

  # --- UI & UTILS ---
  flutter_markdown: ^0.6.14
  flutter_animate: ^4.5.0
  flutter_svg: ^2.0.9
  percent_indicator: ^4.2.3
  fl_chart: ^0.66.0
  cupertino_icons: ^1.0.8
  fluttertoast: ^8.2.6

  # --- NETWORK & STORAGE ---
  http: ^1.2.0
  http_parser: ^4.0.2
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # UPDATE: Khớp version với yêu cầu của Flutter SDK hiện tại
  intl: ^0.19.0 
  dio: ^5.4.0
  image_picker: ^1.1.0
  crypto: ^3.0.3
  
  # --- ADDITIONAL DEPENDENCIES ---
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  logger: ^2.0.2+1
  cached_network_image: ^3.3.1
  flutter_staggered_animations: ^1.1.1
  url_launcher: ^6.2.5
  shimmer: ^2.0.0

  equatable: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mocktail: ^1.0.4
  
  # --- CODE GENERATION ---
  build_runner: ^2.4.7
  
  # Hive Generator
  hive_generator: ^2.0.1
  
  # Riverpod Generator
  riverpod_generator: ^2.3.11
  riverpod_lint: ^2.3.10
  custom_lint: ^0.6.4
  
  # Freezed & JSON Serialization
  freezed: ^2.4.6
  json_serializable: ^6.7.1
  analyzer: ^6.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
