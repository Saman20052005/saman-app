<!-- Thumbnail 2 -->
<button class="relative w-14 h-14 rounded-lg overflow-hidden shrink-0 transition-transform active:scale-95 bg-surface-container-high opacity-70 hover:opacity-100" id="thumb-btn-1" onclick="selectThumbnail(1)" type="button">
<img class="w-full h-full object-cover" data-alt="Healthy post-workout snack with Greek yogurt bowl topped with chia seeds, raw blueberries, and sliced organic almonds presented on modern slate tabletop with soft diffused gym studio light." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDtIRwnHQ7veS_6zktVopsxlhr3Y2DAI82TP1biL6XZzdKC6fdGzt6EeVgmiB-FttSw71JkFCsqGkQDBMKAssyRHgeHE7qkIywm8MTd3alzQKnhJKDVXQLyUtY_Xxf5bqQGnSc-GO-cALIabUUvCFZajKLdJXIZ5xeCCG8GruUMChrbbwqdFvMmV3_qam9PcmhjkOaI8KET4mSJiWu_zMuPvq3f10PljIbs8ukIXP_f">
<span class="absolute bottom-0.5 right-0.5 w-4 h-4 rounded bg-surface-container-highest text-on-surface font-label-sm text-[10px] flex items-center justify-center font-bold">2</span>
</button>
<!-- Add Photo Slot -->
<button aria-label="Thêm ảnh" class="w-14 h-14 rounded-lg bg-surface-container flex flex-col items-center justify-center text-on-surface-variant hover:text-primary active:scale-95 transition-all shrink-0" type="button">
<span class="material-symbols-outlined text-[20px]">add_photo_alternate</span>

<!-- Quick Info / Status indicator -->

</div>

<!-- Aspect Ratio Bar & Rotate Controls -->
<div class="flex items-center justify-between gap-space-sm bg-surface-container-low p-2 rounded-xl">
<!-- 3 Aspect Ratio Segmented Buttons -->
<div class="flex items-center gap-1.5 flex-1 bg-surface-container p-1 rounded-lg"><button class="flex-1 py-1.5 rounded-md font-label-md text-label-md text-on-surface-variant hover:text-on-surface transition-all text-center flex items-center justify-center gap-1.5" id="btn-ratio-orig" onclick="setAspectRatio('orig')" type="button"><span class="material-symbols-outlined text-[16px] text-[#9ca3af]">crop_free</span><span class="">Gốc</span></button><button class="flex-1 py-1.5 rounded-md font-label-md text-label-md bg-[#23252a] text-[#54C7A5] font-semibold transition-all text-center flex items-center justify-center gap-1.5 shadow-sm border border-[#54C7A5]/20" id="btn-ratio-sq" onclick="setAspectRatio('square')" type="button"><span class="material-symbols-outlined text-[16px] text-[#54C7A5]">crop_square</span><span class="">Vuông</span></button><button class="flex-1 py-1.5 rounded-md font-label-md text-label-md text-on-surface-variant hover:text-on-surface transition-all text-center flex items-center justify-center gap-1.5" id="btn-ratio-vert" onclick="setAspectRatio('vert')" type="button"><span class="material-symbols-outlined text-[16px] text-[#9ca3af]">crop_portrait</span><span class="">Dọc</span></button></div>
<!-- Rotate 90 Deg Button -->
<button aria-label="Xoay ảnh 90 độ" class="w-10 h-10 rounded-lg bg-surface-container flex items-center justify-center text-on-surface hover:text-primary active:scale-90 transition-transform" id="btn-rotate" onclick="rotatePhoto()" type="button"><span class="material-symbols-outlined text-[20px] text-[#9ca3af] hover:text-on-surface transition-colors">rotate_90_degrees_cw</span></button>
</div>
<!-- Restrained Precision Lighting Tools -->
<div class="flex flex-col gap-space-md bg-surface-container-low p-space-md rounded-xl"><div class="flex items-center justify-between"><div class="flex items-center gap-2"><span class="material-symbols-outlined text-[#9ca3af] text-[20px]">tune</span><span class="font-headline-sm text-headline-sm text-on-surface text-sm font-medium">Tinh chỉnh ánh sáng</span></div><span class="font-label-sm text-label-sm text-on-surface-variant" id="adjustment-status">Tự nhiên</span></div><div class="flex flex-col gap-1.5"><div class="flex items-center justify-between"><div class="flex items-center gap-2 text-on-surface"><span class="material-symbols-outlined text-[18px] text-[#9ca3af]">light_mode</span><span class="font-body-md text-body-md text-xs font-normal text-on-surface-variant">Độ sáng</span></div><span class="font-label-md text-label-md text-on-surface-variant tabular-nums" id="brightness-val">0</span></div><div class="relative w-full flex items-center h-7"><input class="w-full h-1.5 bg-[#272930] rounded-lg appearance-none cursor-pointer accent-[#54C7A5]" id="slider-brightness" max="50" min="-50" oninput="handleAdjustmentChange()" type="range" value="0"></div></div><div class="flex flex-col gap-1.5"><div class="flex items-center justify-between"><div class="flex items-center gap-2 text-on-surface"><span class="material-symbols-outlined text-[18px] text-[#9ca3af]">contrast</span><span class="font-body-md text-body-md text-xs font-normal text-on-surface-variant">Độ tương phản</span></div><span class="font-label-md text-label-md text-on-surface-variant tabular-nums" id="contrast-val">0</span></div><div class="relative w-full flex items-center h-7"><input class="w-full h-1.5 bg-[#272930] rounded-lg appearance-none cursor-pointer accent-[#54C7A5]" id="slider-contrast" max="50" min="-50" oninput="handleAdjustmentChange()" type="range" value="0"></div></div></div>
<!-- Footer Utility Bar: Reset Action & Alignment Grid Toggle -->
<div class="flex items-center justify-between pt-1">
<!-- Reset Button (Enabled on changes) -->
<button class="flex items-center gap-1.5 px-space-md py-2 rounded-lg bg-surface-container-low text-on-surface-variant opacity-40 cursor-not-allowed transition-all active:scale-95" disabled="" id="btn-reset" onclick="resetAdjustments()" type="button">
<span class="material-symbols-outlined text-[18px]">restart_alt</span>
<span class="font-label-md text-label-md">Đặt lại</span>
</button>
<!-- Toggle Grid Helper -->
<button class="flex items-center gap-1.5 px-3 py-2 rounded-lg bg-surface-container-low text-on-surface hover:text-primary transition-colors text-xs" id="btn-toggle-grid" onclick="toggleGrid()" type="button"><span class="material-symbols-outlined text-[18px] text-[#9ca3af]">grid_on</span><span class="font-label-sm text-label-sm text-on-surface-variant hover:text-on-surface transition-colors">Lưới căn chỉnh</span></button>
</div>
</div>
</div>
<script>
  let currentRotation = 0;
  let gridVisible = true;
  let activeIndex = 0;

  function setAspectRatio(type) {
    const frame = document.getElementById('preview-frame');
    const bOrig = document.getElementById('btn-ratio-orig');
    const bSq = document.getElementById('btn-ratio-sq');
    const bVert = document.getElementById('btn-ratio-vert');

    [bOrig, bSq, bVert].forEach(b => {
      b.className = 'flex-1 py-1.5 rounded-md font-label-md text-label-md text-on-surface-variant hover:text-on-surface transition-all text-center flex items-center justify-center gap-1';
    });

    const activeClasses = 'flex-1 py-1.5 rounded-md font-label-md text-label-md bg-surface-container-high text-primary font-semibold transition-all text-center flex items-center justify-center gap-1 shadow-sm';

    frame.classList.remove('aspect-square', 'aspect-[4/5]', 'aspect-[4/3]');

    if (type === 'orig') {
      frame.classList.add('aspect-[4/3]');
      bOrig.className = activeClasses;
    } else if (type === 'square') {
      frame.classList.add('aspect-square');
      bSq.className = activeClasses;
    } else if (type === 'vert') {
      frame.classList.add('aspect-[4/5]');
      bVert.className = activeClasses;
    }
    checkModified();
  }

  function rotatePhoto() {
    currentRotation = (currentRotation + 90) % 360;
    updatePhotoFilter();
    checkModified();
  }

  function handleAdjustmentChange() {
    const bVal = document.getElementById('slider-brightness').value;
    const cVal = document.getElementById('slider-contrast').value;
    
    document.getElementById('brightness-val').textContent = (bVal > 0 ? '+' : '') + bVal;
    document.getElementById('contrast-val').textContent = (cVal > 0 ? '+' : '') + cVal;

    updatePhotoFilter();
    checkModified();
  }

  function updatePhotoFilter() {
    const bVal = parseInt(document.getElementById('slider-brightness').value, 10);
    const cVal = parseInt(document.getElementById('slider-contrast').value, 10);
    const photo = document.getElementById('active-photo');

    const brightnessMult = (100 + bVal) / 100;
    const contrastMult = (100 + cVal) / 100;

    photo.style.filter = `brightness(${brightnessMult * 100}%) contrast(${contrastMult * 100}%)`;
    photo.style.transform = `rotate(${currentRotation}deg)`;
  }

  function checkModified() {
    const bVal = parseInt(document.getElementById('slider-brightness').value, 10);
    const cVal = parseInt(document.getElementById('slider-contrast').value, 10);
    const isModified = bVal !== 0 || cVal !== 0 || currentRotation !== 0;

    const resetBtn = document.getElementById('btn-reset');
    const statusLabel = document.getElementById('adjustment-status');

    if (isModified) {
      resetBtn.disabled = false;
      resetBtn.classList.remove('opacity-40', 'cursor-not-allowed', 'text-on-surface-variant');
      resetBtn.classList.add('text-primary', 'cursor-pointer');
      statusLabel.textContent = 'Đã chỉnh';
      statusLabel.classList.add('text-primary');
    } else {
      resetBtn.disabled = true;
      resetBtn.classList.add('opacity-40', 'cursor-not-allowed', 'text-on-surface-variant');
      resetBtn.classList.remove('text-primary', 'cursor-pointer');
      statusLabel.textContent = 'Tự nhiên';
      statusLabel.classList.remove('text-primary');
    }
  }

  function resetAdjustments() {
    document.getElementById('slider-brightness').value = 0;
    document.getElementById('slider-contrast').value = 0;
    document.getElementById('brightness-val').textContent = '0';
    document.getElementById('contrast-val').textContent = '0';
    currentRotation = 0;
    setAspectRatio('square');
    updatePhotoFilter();
    checkModified();
  }

  function toggleGrid() {
    const grid = document.getElementById('grid-overlay');
    gridVisible = !gridVisible;
    grid.style.opacity = gridVisible ? '0.25' : '0';
  }

  function selectThumbnail(idx) {
    activeIndex = idx;
    const b0 = document.getElementById('thumb-btn-0');
    const b1 = document.getElementById('thumb-btn-1');
    if (idx === 0) {
      b0.classList.add('ring-2', 'ring-primary', 'opacity-100');
      b0.classList.remove('opacity-70');
      b1.classList.remove('ring-2', 'ring-primary');
      b1.classList.add('opacity-70');
    } else {
      b1.classList.add('ring-2', 'ring-primary', 'opacity-100');
      b1.classList.remove('opacity-70');
      b0.classList.remove('ring-2', 'ring-primary');
      b0.classList.add('opacity-70');
    }
  }
</script></main>
