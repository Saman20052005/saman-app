<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>Saman Live Form Check - Wide Grip Pull-up</title>
<!-- Google Fonts: Space Grotesk, Inter, JetBrains Mono & Material Symbols Outlined -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<!-- Tailwind CSS v3 with Plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            obsidian: {
              DEFAULT: '#0C0D0E',
              900: '#0C0D0E',
              850: '#121316',
              800: '#16171B',
              700: '#1E2026'
            },
            offwhite: '#F9FAFB',
            emeraldLive: '#10B981'
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Space Grotesk', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          }
        }
      }
    };
  </script>
<!-- Custom Styles for Mobile Safe Areas and Viewport Constraints -->
<style data-purpose="mobile-viewport-reset">
    html, body {
      background-color: #0C0D0E;
      color: #F9FAFB;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .pt-safe {
      padding-top: max(env(safe-area-inset-top, 16px), 16px);
    }
    .pb-safe {
      padding-bottom: max(env(safe-area-inset-bottom, 20px), 20px);
    }
  </style>
<!-- Minimal Corner Reticle Guides -->
<style data-purpose="reticle-markers">
    .reticle-corner {
      position: absolute;
      width: 22px;
      height: 22px;
      border-color: rgba(255, 255, 255, 0.28);
      pointer-events: none;
    }
    .reticle-tl { top: 14px; left: 14px; border-top-width: 1.5px; border-left-width: 1.5px; }
    .reticle-tr { top: 14px; right: 14px; border-top-width: 1.5px; border-right-width: 1.5px; }
    .reticle-bl { bottom: 14px; left: 14px; border-bottom-width: 1.5px; border-left-width: 1.5px; }
    .reticle-br { bottom: 14px; right: 14px; border-bottom-width: 1.5px; border-right-width: 1.5px; }
  </style>
</head>
<body class="bg-obsidian w-full h-full flex flex-col justify-between relative overflow-hidden select-none">
<!-- BEGIN: LiveCameraFeed -->
<!-- Underlaid edge-to-edge camera feed with athlete visible full-body -->
<div class="absolute inset-0 z-0 w-full h-full overflow-hidden bg-obsidian-900" data-purpose="live-camera-viewport">
<!-- Camera stream frame from low angle viewpoint -->
<img alt="Athlete performing wide grip pull-up on a pull-up bar in a modern gym" class="w-full h-full object-cover object-center transform scale-[1.02]" src="https://lh3.googleusercontent.com/aida/AEtjO1VMTpVSEPEwozBEG3XXAZJcevydDzmqD_okjbGPQUC3GBklL2yASh1aaohFLZ6JyStUgXCnESoMvtOUqRGeUvZFZwPjRi3IQnEyDj5t9-NwRjfrUu4EyYAPpteQSwbDBZtyJTGQzHzbYjPbxzUgvMDrTSngMxNv7Rf0Xe2M2uP1F-fqPvLJyXQYLKh2dTGUyhaKLbwP1LBlDpObIU-P2p7mKEIXvDd3skfyU38ksEg0qdmSZPo7urfUrjw"/>
<!-- Ambient Vignette & Legibility Gradients -->
<div class="absolute inset-0 bg-gradient-to-b from-[#0C0D0E]/85 via-transparent to-[#0C0D0E]/95 pointer-events-none"></div>
<div class="absolute inset-0 bg-black/15 pointer-events-none"></div>
<!-- Active AI Tracking Bounds / Framing Reticles -->
<div class="absolute inset-x-3.5 top-28 bottom-56 pointer-events-none z-10 border border-white/10 rounded-2xl">
<div class="reticle-corner reticle-tl rounded-tl-sm"></div>
<div class="reticle-corner reticle-tr rounded-tr-sm"></div>
<div class="reticle-corner reticle-bl rounded-bl-sm"></div>
<div class="reticle-corner reticle-br rounded-br-sm"></div>
<!-- Top-left tracking status badge -->
<div class="absolute top-4 left-4 flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-black/60 backdrop-blur-md border border-white/10">
<span class="w-2 h-2 rounded-full bg-emeraldLive animate-pulse"></span>
<span class="font-mono text-[11px] font-medium tracking-tight text-white/90">Full body in frame</span>
</div>
</div>
</div>
<!-- END: LiveCameraFeed -->
<!-- BEGIN: TopSessionHeader -->
<header class="relative z-20 w-full pt-safe px-4 pb-2 flex flex-col items-center" data-purpose="in-session-header">
<!-- Top control row -->
<div class="w-full flex items-center justify-between min-h-[44px]">
<!-- Close / Exit Session Button -->
<button aria-label="Exit session" class="w-10 h-10 rounded-full flex items-center justify-center bg-obsidian-850/80 backdrop-blur-md border border-white/10 text-gray-300 hover:text-white active:scale-95 transition-all" type="button">
<span class="material-symbols-outlined text-[20px]">close</span>
</button>
<!-- Center Title and Status -->
<div class="flex flex-col items-center text-center">
<div class="flex items-center gap-1.5 leading-none mb-1">
<span class="w-1.5 h-1.5 rounded-full bg-emeraldLive"></span>
<span class="font-mono text-[10px] uppercase tracking-[0.2em] font-medium text-emeraldLive">FORM CHECK</span>
</div>
<h1 class="font-display text-[16px] font-semibold text-offwhite leading-tight tracking-tight">
          Wide Grip Pull-up
        </h1>
</div>
<!-- Sound feedback toggle -->
<button aria-label="Toggle audio feedback" class="w-10 h-10 rounded-full flex items-center justify-center bg-obsidian-850/80 backdrop-blur-md border border-white/10 text-gray-300 hover:text-white active:scale-95 transition-all" type="button">
<span class="material-symbols-outlined text-[20px]">volume_up</span>
</button>
</div>
<!-- Framing Guidance Banner -->
<div class="mt-2.5 inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-obsidian-800/80 backdrop-blur-md border border-white/10 shadow-sm">
<span class="font-sans text-[12px] text-gray-300/90 font-normal">Keep your full body and the bar in view</span>
</div>
</header>
<!-- END: TopSessionHeader -->
<!-- BEGIN: TelemetryAndControls -->
<main class="relative z-20 w-full px-4 pb-safe flex flex-col justify-end space-y-3" data-purpose="hud-and-action-dock">
<!-- Telemetry & Form Cue Cluster -->
<div class="w-full flex flex-col space-y-2.5">
<!-- Distance-Readable Reps Telemetry Badge -->
<div class="self-start flex items-baseline gap-2 px-3.5 py-1.5 rounded-xl bg-obsidian-850/80 backdrop-blur-md border border-white/10">
<span class="font-mono text-3xl font-bold tracking-tight text-offwhite leading-none">4</span>
<span class="font-mono text-[11px] tracking-wider uppercase text-gray-300 font-medium">reps observed</span>
</div>
<!-- Distance-Readable Live Form Cue Card -->
<article class="w-full bg-obsidian-800/90 backdrop-blur-md border border-white/10 rounded-2xl p-4 shadow-2xl flex items-center gap-3.5" data-purpose="realtime-coaching-cue">
<!-- Downward Alignment Icon Badge -->
<div class="w-10 h-10 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center flex-shrink-0 text-emeraldLive">
<span class="material-symbols-outlined text-[22px]">arrow_downward</span>
</div>
<!-- Single Laser-Focused Actionable Prompt -->
<div class="flex-1 min-w-0">
<p class="font-display text-[15px] sm:text-[16px] font-semibold text-offwhite leading-snug tracking-normal">
            Keep shoulders down as you pull
          </p>
</div>
</article>
</div>
<!-- Action Dock Controls -->
<div class="w-full flex flex-col items-center pt-1 space-y-2" data-purpose="bottom-controls">
<!-- Primary End Form Check CTA Button -->
<button class="w-full h-13 py-3.5 px-6 rounded-xl bg-offwhite hover:bg-white active:bg-gray-200 text-obsidian-900 font-sans font-semibold text-[15px] flex items-center justify-center transition duration-150 shadow-lg active:scale-[0.99]" type="button">
        End form check
      </button>
<!-- Secondary Camera Pause Control -->
<button class="inline-flex items-center justify-center gap-1.5 py-1.5 px-3 text-gray-300 hover:text-white transition-colors text-[13px] font-medium font-sans active:opacity-75" type="button">
<span class="material-symbols-outlined text-[18px]">pause</span>
<span>Pause camera</span>
</button>
</div>
</main>
<!-- END: TelemetryAndControls -->
</body></html>
