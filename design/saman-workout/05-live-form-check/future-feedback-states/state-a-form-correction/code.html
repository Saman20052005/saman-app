<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<meta content="fullscreen" name="shell-type"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
    @layer base {
      html, body {
        width: 100vw;
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #0C0D0E;
        color: #F9FAFB;
      }
      body {
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
      }
      .pb-safe {
        padding-bottom: env(safe-area-inset-bottom, 16px);
      }
      .pt-safe {
        padding-top: env(safe-area-inset-top, 16px);
      }
    }
    ::-webkit-scrollbar {
      display: none;
    }
  </style>
<script src="https://cdn.tailwindcss.com"></script>
<script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            saman: {
              base: "#0C0D0E",
              card: "#16171B",
              elevated: "#1E2026",
              border: "#26282F",
              hairline: "rgba(255, 255, 255, 0.08)",
              textPrimary: "#F9FAFB",
              textSlate: "#9CA3AF",
              textMuted: "#6B7280",
              emerald: "#10B981",
              amber: "#F59E0B"
            }
          },
          fontFamily: {
            headline: ["Space Grotesk", "sans-serif"],
            body: ["Inter", "sans-serif"],
            mono: ["JetBrains Mono", "monospace"]
          }
        }
      }
    };
  </script>
</head>
<body class="bg-[#0C0D0E] font-body text-sm text-[#F9FAFB] antialiased h-screen w-full flex flex-col justify-between overflow-hidden relative selection:bg-[#10B981] selection:text-[#0C0D0E]">
<!-- TOP COMPACT CONTEXT HEADER (Visual-only: audio button removed) -->
<header class="w-full pt-safe bg-[#0C0D0E] z-30 flex-shrink-0 border-b border-[#26282F]/60">
<div class="h-14 px-4 flex items-center justify-between">
<!-- Back / Close Navigation Control -->
<button aria-label="Close form check" class="w-10 h-10 -ml-1 rounded-xl bg-[#16171B] border border-[#26282F] flex items-center justify-center text-[#9CA3AF] hover:text-[#F9FAFB] active:scale-95 transition-all">
<span class="material-symbols-outlined text-[20px]">close</span>
</button>
<!-- Center Hierarchy: Form Check & Exercise Title -->
<div class="flex flex-col items-center justify-center text-center">
<div class="flex items-center gap-1.5">
<span class="w-1.5 h-1.5 rounded-full bg-[#10B981] animate-pulse"></span>
<span class="font-mono text-[10px] uppercase tracking-[0.14em] font-semibold text-[#10B981]">Form Check</span>
</div>
<h1 class="font-headline text-[15px] font-semibold text-[#F9FAFB] tracking-tight leading-tight mt-0.5">Wide Grip Pull-up</h1>
</div>
<!-- Balanced spacer to maintain centered header without audio icon -->
<div class="w-10 h-10 -mr-1"></div>
</div>
</header>
<!-- MAIN VIEWPORT CONTAINER -->
<main class="relative flex-1 w-full overflow-hidden flex flex-col justify-between min-h-0">
<!-- Full-bleed Camera Feed -->
<img alt="Live camera view of athlete performing Wide Grip Pull-up" class="absolute inset-0 w-full h-full object-cover object-center pointer-events-none" src="https://lh3.googleusercontent.com/aida/AEtjO1VMTpVSEPEwozBEG3XXAZJcevydDzmqD_okjbGPQUC3GBklL2yASh1aaohFLZ6JyStUgXCnESoMvtOUqRGeUvZFZwPjRi3IQnEyDj5t9-NwRjfrUu4EyYAPpteQSwbDBZtyJTGQzHzbYjPbxzUgvMDrTSngMxNv7Rf0Xe2M2uP1F-fqPvLJyXQYLKh2dTGUyhaKLbwP1LBlDpObIU-P2p7mKEIXvDd3skfyU38ksEg0qdmSZPo7urfUrjw"/>
<!-- Gradient scrim overlays for readable HUD text without obstructing athlete -->
<div class="absolute inset-0 bg-gradient-to-b from-black/70 via-transparent to-black/85 pointer-events-none"></div>
<!-- Top Section inside camera: Placement banner & restrained status chip -->
<div class="relative z-10 w-full px-4 pt-3 flex flex-col gap-2.5">
<!-- Placement cue banner: 'Keep your full body and the bar in view' -->
<div class="w-full bg-[#16171B]/80 backdrop-blur-md border border-[#26282F] rounded-xl px-3.5 py-2 flex items-center justify-between shadow-sm">
<div class="flex items-center gap-2 min-w-0">
<span class="material-symbols-outlined text-[#9CA3AF] text-[17px] flex-shrink-0">center_focus_strong</span>
<p class="font-body text-[12px] text-[#9CA3AF] leading-tight truncate">
              Keep your <span class="text-[#F9FAFB] font-medium">full body and the bar</span> in view
            </p>
</div>
<span class="w-2 h-2 rounded-full bg-[#10B981] flex-shrink-0"></span>
</div>
<!-- Single restrained tracking status pill -->
<div class="self-start inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-[#0C0D0E]/80 backdrop-blur-md border border-[#10B981]/30">
<span class="w-2 h-2 rounded-full bg-[#10B981] animate-pulse"></span>
<span class="font-body text-[11px] font-medium text-[#F9FAFB] tracking-tight">Full body in frame</span>
</div>
</div>
<!-- Bottom Section inside camera: Distance-readable Reps counter & Variant A Amber Correction Cue Card -->
<div class="relative z-10 w-full px-4 pb-3 flex flex-col gap-2.5">
<!-- Prominent distance-readable Reps counter HUD -->
<div class="self-start bg-[#0C0D0E]/90 backdrop-blur-md px-4 py-2.5 rounded-2xl border border-white/15 shadow-2xl flex items-center gap-3">
<span class="font-mono text-[36px] font-bold text-[#F9FAFB] leading-none tabular-nums tracking-tight">4</span>
<div class="flex flex-col justify-center text-left leading-tight">
<span class="font-mono text-[11px] uppercase tracking-[0.14em] text-[#F9FAFB] font-semibold">reps observed</span>
<span class="font-mono text-[9px] uppercase tracking-wider text-[#9CA3AF]">live observation</span>
</div>
</div>
<!-- Variant A Feedback Card: Calm Amber 'Adjust your form' State -->
<div class="w-full bg-[#16171B]/95 backdrop-blur-md border border-[#F59E0B]/35 rounded-2xl p-3.5 shadow-2xl flex items-center gap-3">
<div class="w-8 h-8 rounded-full bg-[#F59E0B]/15 text-[#F59E0B] flex items-center justify-center flex-shrink-0 border border-[#F59E0B]/20">
<span class="material-symbols-outlined text-[19px]">arrow_downward</span>
</div>
<div class="flex-1 min-w-0">
<div class="flex items-center gap-2 mb-0.5">
<span class="font-mono text-[9px] uppercase tracking-[0.14em] text-[#F59E0B] font-semibold">Adjust Form</span>
<span class="w-1 h-1 rounded-full bg-[#F59E0B]/60"></span>
<span class="font-body text-[10px] text-[#9CA3AF]">Form adjustment</span>
</div>
<p class="font-headline text-[15px] font-semibold text-[#F9FAFB] leading-snug tracking-tight">
              Keep your shoulders down on the next rep.
            </p>
</div>
</div>
</div>
</main>
<!-- GROUNDED BOTTOM ACTION DOCK (Safe Area Compliant, No Audio Control) -->
<footer class="w-full bg-[#0C0D0E] border-t border-[#26282F] pt-3 pb-safe px-4 flex flex-col items-center gap-2 flex-shrink-0">
<div class="w-full flex flex-col items-center gap-2.5">
<!-- Primary Action CTA: Solid Off-White Button with Dark Obsidian Text -->
<button aria-label="End form check" class="w-full h-12 rounded-xl bg-[#F9FAFB] text-[#0C0D0E] font-headline text-[15px] font-semibold tracking-tight hover:bg-white active:scale-[0.99] transition-all flex items-center justify-center gap-2 shadow-lg">
<span class="material-symbols-outlined text-[20px]">stop_circle</span>
<span>End form check</span>
</button>
<!-- Discreet Secondary Control -->
<button aria-label="Pause camera" class="h-7 px-4 text-[#9CA3AF] hover:text-[#F9FAFB] font-body text-[13px] font-medium transition-colors flex items-center justify-center gap-1.5 active:scale-95">
<span class="material-symbols-outlined text-[16px]">pause</span>
<span>Pause camera</span>
</button>
</div>
</footer>
</body></html>
