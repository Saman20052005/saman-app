<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>SAMAN - Create Journey</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
  @layer base {
    html, body {
      width: 100vw;
      margin: 0;
      padding: 0;
      background-color: #0C0D0E;
      color: #F3F4F6;
      font-family: 'Inter', sans-serif;
    }
    body {
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
    }
    .pb-safe {
      padding-bottom: env(safe-area-inset-bottom, 16px);
    }
    .pt-safe {
      padding-top: env(safe-area-inset-top, 0px);
    }
  }
  ::-webkit-scrollbar {
    display: none;
  }
  .tabular-nums {
    font-variant-numeric: tabular-nums;
  }
</style>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          brand: {
            bg: "#0C0D0E",
            card: "#16171B",
            cardHover: "#1F2126",
            border: "#26282F",
            iconBg: "#212328",
            muted: "#94979E",
            accent: "#10B981"
          }
        },
        fontFamily: {
          headline: ["Space Grotesk", "sans-serif"],
          body: ["Inter", "sans-serif"],
          mono: ["JetBrains Mono", "monospace"]
        }
      }
    }
  };
</script>
</head>
<body class="bg-[#0C0D0E] font-body text-sm text-[#F3F4F6] antialiased min-h-screen flex flex-col justify-between selection:bg-[#10B981]/30">
<!-- TOP STATUS BAR -->
<div class="w-full pt-safe bg-[#0C0D0E] z-40 sticky top-0">
<div class="h-11 px-6 flex items-center justify-between text-xs text-[#F3F4F6] font-medium tracking-tight">
<span class="font-mono text-[13px] font-semibold">9:41</span>
<div class="flex items-center gap-2 text-[14px]">
<span class="material-symbols-outlined text-[15px] leading-none">signal_cellular_alt</span>
<span class="material-symbols-outlined text-[15px] leading-none">wifi</span>
<span class="material-symbols-outlined text-[18px] leading-none">battery_full</span>
</div>
</div>
</div>
<!-- MAIN WRAPPER -->
<div class="flex-1 w-full max-w-md mx-auto px-4 flex flex-col justify-between pb-8">
<main class="space-y-6 pt-1">
<!-- TOP NAVIGATION & HEADER -->
<header class="space-y-4"><div class="flex items-center justify-between"><button aria-label="Back" class="w-10 h-10 -ml-2 rounded-xl flex items-center justify-center text-[#94979E] hover:text-[#F3F4F6] hover:bg-[#16171B] transition-colors active:scale-95" type="button"><span class="material-symbols-outlined text-[22px]">arrow_back</span></button></div><div><h1 class="font-headline text-[28px] font-semibold leading-tight text-[#F3F4F6] tracking-tight">Create Journey</h1><p class="text-sm text-[#94979E] mt-1">A small habit, lasting change.</p></div></header>
<!-- SECTION 1: FOCUS SELECTION -->
<section class="space-y-3"><label class="block text-[15px] font-medium text-[#F3F4F6]">What do you want to focus on?</label><div class="space-y-2.5"><button class="w-full text-left px-4 py-3.5 rounded-xl bg-[#16171B] border border-[#26282F] hover:border-[#383A42] transition-colors flex items-center justify-between group active:scale-[0.99]" type="button"><div class="flex items-center gap-3.5"><span class="material-symbols-outlined text-[20px] text-[#94979E] group-hover:text-[#F3F4F6] transition-colors">fitness_center</span><span class="text-[15px] font-medium text-[#F3F4F6]">Workout</span></div><div class="w-5 h-5 rounded-full border border-[#383A42] flex items-center justify-center"></div></button><button class="w-full text-left px-4 py-3.5 rounded-xl bg-[#16171B] border border-[#26282F] hover:border-[#383A42] transition-colors flex items-center justify-between group active:scale-[0.99]" type="button"><div class="flex items-center gap-3.5"><span class="material-symbols-outlined text-[20px] text-[#94979E] group-hover:text-[#F3F4F6] transition-colors">restaurant</span><span class="text-[15px] font-medium text-[#F3F4F6]">Nutrition</span></div><div class="w-5 h-5 rounded-full border border-[#383A42] flex items-center justify-center"></div></button><button class="w-full text-left px-4 py-3.5 rounded-xl bg-[#16171B] border border-[#10B981]/50 ring-1 ring-[#10B981]/40 flex items-center justify-between group active:scale-[0.99]" type="button"><div class="flex items-center gap-3.5"><span class="material-symbols-outlined text-[20px] text-[#10B981]">sync_alt</span><span class="text-[15px] font-medium text-[#F3F4F6]">Both</span></div><div class="w-5 h-5 rounded-full bg-[#10B981] flex items-center justify-center text-[#0C0D0E]"><span class="material-symbols-outlined text-[14px] font-bold">check</span></div></button></div></section>
<!-- SECTION 2: DURATION SELECTION -->
<section class="space-y-3"><label class="block text-[15px] font-medium text-[#F3F4F6]">How long to commit?</label><div class="p-1 bg-[#16171B] border border-[#26282F] rounded-xl flex items-center gap-1"><button class="flex-1 py-2 rounded-lg text-sm text-[#94979E] hover:text-[#F3F4F6] font-medium transition-colors text-center" type="button">7 days</button><button class="flex-1 py-2 rounded-lg text-sm text-[#94979E] hover:text-[#F3F4F6] font-medium transition-colors text-center" type="button">14 days</button><button class="flex-1 py-2 rounded-lg bg-[#F9FAFB] text-[#0C0D0E] font-medium text-center shadow-sm" type="button">21 days</button><button class="flex-1 py-2 rounded-lg text-sm text-[#94979E] hover:text-[#F3F4F6] font-medium transition-colors text-center" type="button">30 days</button></div><p class="text-[13px] text-[#94979E]">3 weeks to build a habit.</p></section>
<!-- SECTION 3: DAILY REMINDER -->
<section class="space-y-3"><div class="space-y-3 pt-1"><div class="flex items-center justify-between py-1"><div class="flex items-center gap-3"><span class="material-symbols-outlined text-[20px] text-[#94979E]">notifications</span><span class="text-[15px] font-medium text-[#F3F4F6]">Daily reminder</span></div><div class="w-11 h-6 bg-[#10B981] rounded-full p-0.5 flex items-center justify-end cursor-pointer shadow-inner"><div class="w-5 h-5 bg-[#0C0D0E] rounded-full shadow"></div></div></div><div class="flex items-center justify-between py-1 border-t border-[#26282F] pt-3"><div class="flex items-center gap-3"><span class="material-symbols-outlined text-[20px] text-[#94979E]">schedule</span><span class="text-[14px] text-[#94979E]">Reminder time</span></div><div class="flex items-center gap-1.5 cursor-pointer"><span class="text-sm font-medium text-[#F3F4F6]">8:00 PM</span><span class="material-symbols-outlined text-[#94979E] text-[18px]">chevron_right</span></div></div></div></section>
<!-- SECTION 4: COMPACT SUMMARY CARD -->
</main>
<!-- BOTTOM STICKY ACTION -->
<div class="pt-6 w-full space-y-2"><button class="w-full h-11 py-3 px-4 rounded-xl bg-[#F9FAFB] hover:bg-white text-[#0C0D0E] font-medium text-[15px] flex items-center justify-center shadow-sm active:scale-[0.98] transition-all" type="button">Start Journey</button><p class="text-center text-[13px] text-[#94979E]">You can adjust reminders anytime.</p></div>
</div>
</body></html>
