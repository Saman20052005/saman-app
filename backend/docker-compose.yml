version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: mongodb_container
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: saman_backend_container
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      PORT: ${PORT:-8000}
      MONGO_URI: ${MONGO_URI:-mongodb://mongodb:27017}
      DB_NAME: ${DB_NAME:-saman_fitness}
      JWT_SECRET: ${JWT_SECRET:-dev-local-jwt-secret-change-in-production}
      MEDIA_STORAGE_PROVIDER: ${MEDIA_STORAGE_PROVIDER:-local}
      ALLOW_LOCAL_MEDIA_STORAGE: ${ALLOW_LOCAL_MEDIA_STORAGE:-true}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_SWIFT_MODEL: ${GEMINI_SWIFT_MODEL:-gemini-2.5-flash-lite}
      GEMINI_CORE_MODEL: ${GEMINI_CORE_MODEL:-gemini-2.5-flash}
      GEMINI_PRO_MODEL: ${GEMINI_PRO_MODEL:-gemini-2.5-pro}
      GEMINI_ENABLE_THINKING_CONFIG: ${GEMINI_ENABLE_THINKING_CONFIG:-auto}
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  mongo_data: